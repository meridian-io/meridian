name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          check-latest: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      # Publishes oci://ghcr.io/meridian-io/charts/meridian. The chart's
      # appVersion is set to the git tag so it points at the images built above.
      - name: Publish Helm chart
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in *.*.*) ;; *) VERSION="${VERSION}.0" ;; esac
          helm package charts/meridian --version "$VERSION" --app-version "$GITHUB_REF_NAME"
          echo "$GHCR_TOKEN" | helm registry login ghcr.io -u "$OWNER" --password-stdin
          helm push "meridian-${VERSION}.tgz" oci://ghcr.io/meridian-io/charts
