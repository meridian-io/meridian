apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "meridian.operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "meridian.labels" . | nindent 4 }}
  {{- with .Values.operator.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
# Rules are generated from the operator's kubebuilder markers
# (operator/config/rbac/role.yaml); `make manifests` copies them into the chart.
{{- $role := .Files.Get "files/operator-clusterrole.yaml" | fromYaml }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "meridian.operator.fullname" . }}
  labels:
    {{- include "meridian.labels" . | nindent 4 }}
rules:
  {{- toYaml $role.rules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "meridian.operator.fullname" . }}
  labels:
    {{- include "meridian.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "meridian.operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "meridian.operator.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
# Leader election: a Lease plus Events, in the namespace the operator manages.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "meridian.operator.fullname" . }}-leader-election
  namespace: {{ include "meridian.watchNamespace" . }}
  labels:
    {{- include "meridian.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "meridian.operator.fullname" . }}-leader-election
  namespace: {{ include "meridian.watchNamespace" . }}
  labels:
    {{- include "meridian.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "meridian.operator.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "meridian.operator.fullname" . }}
    namespace: {{ .Release.Namespace }}
