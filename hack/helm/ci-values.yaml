# Turns on every optional part of the chart so CI lints and validates all of it.
operator:
  replicas: 2
  credentials:
    provider: vault
    vault:
      address: https://vault.example.com:8200
  rest:
    enabled: true
    tlsSecretName: meridian-rest-tls
mcp:
  enabled: true
  auth:
    existingSecret: meridian-mcp-token
  enableTools: ["all"]
  replicas: 2
  allowedOrigins: ["https://app.example.com"]
  extraNamespaces: ["meridian-staging"]
  service:
    type: NodePort
    nodePort: 30080
metrics:
  serviceMonitor:
    enabled: true
    labels:
      release: prometheus
  dashboard:
    enabled: true
